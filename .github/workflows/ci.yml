name: pipeline
on:
  push:
    branches: [main]
  pull_request:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run the pipeline (downloads the public UCI dataset, checks its SHA-256)
        run: python -I pipeline/run_all.py
      - name: Sanity checks
        run: python -I tests/test_pipeline.py
